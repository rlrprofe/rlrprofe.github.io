site_name: Material didáctico · Desarrollo de software
site_description: Cursos y manuales de desarrollo de software para el aula
site_url: https://rlrprofe.github.io/
repo_url: https://github.com/rlrprofe/rlrprofe.github.io
repo_name: rlrprofe/rlrprofe.github.io
copyright: Material didáctico de desarrollo de software

theme:
  name: material
  language: es
  features:
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inicio: index.md
